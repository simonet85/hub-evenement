; Dev only: the built-in server keeps one PHP process, so OPcache persists
; across requests. Validating timestamps stats every file on the Windows bind
; mount (~3 ms each, over 2 000 files per request), which costs seconds.
; After editing PHP or Blade files, restart the app: docker compose restart app
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
realpath_cache_size=4096k
realpath_cache_ttl=600
